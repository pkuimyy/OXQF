name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Ubuntu toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build clang
      - run: npm ci
      - run: npm run ci
      - name: Run bounded reader fuzz regression
        run: |
          cmake --preset fuzz
          cmake --build --preset fuzz --target oxq_core_reader_fuzz
          ctest --test-dir build/fuzz -R core.reader-fuzz-smoke --output-on-failure
      - name: Build and verify release candidate
        run: npm run release:package
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: out/release/*
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Configure Visual Studio 2022
        run: cmake --preset windows-msvc
      - name: Build with MSVC Debug
        run: cmake --build --preset windows-msvc-debug
      - name: Test with MSVC Debug
        run: ctest --preset windows-msvc-debug
      - name: Build and verify release candidate
        run: npm run release:package
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: out/release/*
          if-no-files-found: error

  release-evidence:
    runs-on: ubuntu-latest
    needs: [linux, windows]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/download-artifact@v7
        with:
          name: release-linux
          path: artifacts/release
      - uses: actions/download-artifact@v7
        with:
          name: release-windows
          path: artifacts/release
      - name: Verify and assemble cross-platform release evidence
        run: node script/assemble-release.mjs artifacts/release
